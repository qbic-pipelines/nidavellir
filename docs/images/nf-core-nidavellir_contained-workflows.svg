<svg width="1600" height="1100" viewBox="0 0 1600 1100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">nf-core/nidavellir workflow metro map</title>
  <desc id="desc">Metro-style workflow map showing data_storage, generate_ometiff, training and inference tracks with the HITL feedback loop.</desc>

  <defs>
    <style>
      .title { font: 700 34px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .line-label { font: 700 18px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
      .station { font: 500 14px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .legend { font: 500 13px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #334155; }
    </style>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="1100" fill="#f8fafc"/>

  <text x="80" y="75" class="title">nf-core/nidavellir • Workflow metro map</text>
  <text x="80" y="105" class="subtitle">Contained workflows visualized as train lines with shared stations and a HITL loop</text>

  <!-- trunk and interchange -->
  <path d="M120 185 H620" stroke="#64748b" stroke-width="16" stroke-linecap="round"/>
  <circle cx="220" cy="185" r="16" fill="white" stroke="#64748b" stroke-width="7" filter="url(#softShadow)"/>
  <circle cx="620" cy="185" r="18" fill="white" stroke="#64748b" stroke-width="8" filter="url(#softShadow)"/>
  <text x="220" y="155" text-anchor="middle" class="station">Input samplesheet + OMERO refs</text>
  <text x="620" y="155" text-anchor="middle" class="station">workflow_track selector</text>

  <!-- data_storage line -->
  <path d="M620 185 C440 220, 280 300, 220 380 V610" stroke="#22c55e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="410" class="line-label">data_storage</text>
  <circle cx="220" cy="380" r="13" fill="white" stroke="#22c55e" stroke-width="7" filter="url(#softShadow)"/>
  <circle cx="220" cy="500" r="13" fill="white" stroke="#22c55e" stroke-width="7" filter="url(#softShadow)"/>
  <circle cx="220" cy="610" r="13" fill="white" stroke="#22c55e" stroke-width="7" filter="url(#softShadow)"/>
  <text x="250" y="385" class="station">Parse samplesheet metadata</text>
  <text x="250" y="505" class="station">Stage images and labels in OMERO</text>
  <text x="250" y="615" class="station">Persist dataset annotations and IDs</text>

  <!-- generate_ometiff line -->
  <path d="M620 185 V520" stroke="#6366f1" stroke-width="14" stroke-linecap="round"/>
  <text x="648" y="330" class="line-label">generate_ometiff</text>
  <circle cx="620" cy="380" r="13" fill="white" stroke="#6366f1" stroke-width="7" filter="url(#softShadow)"/>
  <circle cx="620" cy="500" r="13" fill="white" stroke="#6366f1" stroke-width="7" filter="url(#softShadow)"/>
  <text x="650" y="385" class="station">BIOFORMATS2RAW → OME-Zarr</text>
  <text x="650" y="505" class="station">RAW2OMETIFF → analysis-ready OME-TIFF</text>

  <!-- training line -->
  <path d="M620 185 C820 220, 980 290, 980 360 V900" stroke="#f97316" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1010" y="330" class="line-label">training scaffold</text>
  <circle cx="980" cy="360" r="13" fill="white" stroke="#f97316" stroke-width="7" filter="url(#softShadow)"/>
  <circle cx="980" cy="450" r="13" fill="white" stroke="#f97316" stroke-width="7" filter="url(#softShadow)"/>
  <circle cx="980" cy="540" r="13" fill="white" stroke="#f97316" stroke-width="7" filter="url(#softShadow)"/>
  <circle cx="980" cy="630" r="13" fill="white" stroke="#f97316" stroke-width="7" filter="url(#softShadow)"/>
  <circle cx="980" cy="720" r="13" fill="white" stroke="#f97316" stroke-width="7" filter="url(#softShadow)"/>
  <circle cx="980" cy="810" r="13" fill="white" stroke="#f97316" stroke-width="7" filter="url(#softShadow)"/>
  <circle cx="980" cy="900" r="13" fill="white" stroke="#f97316" stroke-width="7" filter="url(#softShadow)"/>
  <text x="1010" y="365" class="station">Stage 1: dataset staging + manifest contracts</text>
  <text x="1010" y="455" class="station">Stage 2: parent model staging (BioImage.io / local)</text>
  <text x="1010" y="545" class="station">Stage 3: training runner placeholder</text>
  <text x="1010" y="635" class="station">Stage 4: evaluation placeholder + QA summaries</text>
  <text x="1010" y="725" class="station">Stage 5: publication scaffold for model outputs</text>
  <text x="1010" y="815" class="station">Stage 6: RO-Crate packaging for FAIR provenance</text>
  <text x="1010" y="905" class="station">Versioned model + provenance artifact</text>

  <!-- inference line -->
  <path d="M620 185 C940 210, 1340 270, 1380 390 V760" stroke="#8b5cf6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1260" y="300" class="line-label">inference scaffold</text>
  <circle cx="1380" cy="390" r="13" fill="white" stroke="#8b5cf6" stroke-width="7" filter="url(#softShadow)"/>
  <circle cx="1380" cy="500" r="13" fill="white" stroke="#8b5cf6" stroke-width="7" filter="url(#softShadow)"/>
  <circle cx="1380" cy="610" r="13" fill="white" stroke="#8b5cf6" stroke-width="7" filter="url(#softShadow)"/>
  <circle cx="1380" cy="720" r="13" fill="white" stroke="#8b5cf6" stroke-width="7" filter="url(#softShadow)"/>
  <text x="1410" y="395" class="station">BIOFORMATS2RAW creates sample OME-Zarr inputs</text>
  <text x="1410" y="505" class="station">Inference runner scaffold (current pass-through)</text>
  <text x="1410" y="615" class="station">RAW2OMETIFF exports mask and labelled OME-TIFF</text>
  <text x="1410" y="725" class="station">Collect per-sample metadata + software versions</text>

  <!-- HITL feedback loop line -->
  <path d="M1380 720 C1380 810, 1310 860, 1240 890 C1130 935, 1030 950, 980 900" stroke="#0ea5e9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1320" cy="840" r="13" fill="white" stroke="#0ea5e9" stroke-width="7" filter="url(#softShadow)"/>
  <circle cx="1180" cy="910" r="13" fill="white" stroke="#0ea5e9" stroke-width="7" filter="url(#softShadow)"/>
  <text x="1348" y="845" class="station">Expert review and correction in annotation tools</text>
  <text x="1210" y="915" class="station">Curated labels and QC feedback for retraining</text>
  <text x="1120" y="975" class="legend">HITL feedback line loops curated labels back into training and redeployment.</text>

  <!-- legend -->
  <rect x="80" y="1000" width="640" height="58" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="115" cy="1029" r="10" fill="white" stroke="#334155" stroke-width="5"/>
  <text x="140" y="1035" class="legend">Stations = workflow stages/modules</text>
  <line x1="360" y1="1029" x2="420" y2="1029" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
  <text x="435" y="1035" class="legend">Colored lines = contained workflow tracks</text>
</svg>
