<svg width="1600" height="1200" viewBox="0 0 1600 1200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">nf-core/nidavellir contained workflows diagram</title>
  <desc id="desc">Diagram showing data_storage, generate_ometiff, training scaffold and inference scaffold workflows and their HITL feedback loop.</desc>
  <defs>
    <style>
      .title { font: 700 30px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #222; }
      .subtitle { font: 500 17px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #444; }
      .track-title { font: 700 22px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #203040; }
      .node { font: 500 14px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 13px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #4b5563; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#4B5563" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1200" fill="#f8fafc"/>
  <text x="70" y="70" class="title">nf-core/nidavellir • Contained workflow tracks</text>
  <text x="70" y="100" class="subtitle">Current track DAGs and target human-in-the-loop lifecycle</text>

  <rect x="70" y="150" width="380" height="72" rx="16" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
  <text x="260" y="180" text-anchor="middle" class="node">Input samplesheet and</text>
  <text x="260" y="202" text-anchor="middle" class="node">optional OMERO references</text>

  <rect x="560" y="150" width="300" height="72" rx="36" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="710" y="194" text-anchor="middle" class="node">workflow_track selector</text>

  <path d="M450 186 L560 186" stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- data_storage -->
  <rect x="70" y="280" width="330" height="380" rx="18" fill="#ECFDF5" stroke="#34D399" stroke-width="2"/>
  <text x="235" y="320" text-anchor="middle" class="track-title">data_storage</text>

  <rect x="105" y="350" width="260" height="62" rx="12" fill="white" stroke="#A7F3D0" stroke-width="2"/>
  <text x="235" y="388" text-anchor="middle" class="node">Parse samplesheet metadata</text>

  <rect x="105" y="445" width="260" height="62" rx="12" fill="white" stroke="#A7F3D0" stroke-width="2"/>
  <text x="235" y="474" text-anchor="middle" class="node">Stage images and labels</text>
  <text x="235" y="494" text-anchor="middle" class="node">in OMERO</text>

  <rect x="105" y="540" width="260" height="62" rx="12" fill="white" stroke="#A7F3D0" stroke-width="2"/>
  <text x="235" y="578" text-anchor="middle" class="node">Persist dataset</text>
  <text x="235" y="598" text-anchor="middle" class="node">annotations and IDs</text>

  <path d="M235 412 L235 445" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M235 507 L235 540" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- generate_ometiff -->
  <rect x="440" y="280" width="330" height="280" rx="18" fill="#EEF2FF" stroke="#818CF8" stroke-width="2"/>
  <text x="605" y="320" text-anchor="middle" class="track-title">generate_ometiff</text>

  <rect x="475" y="360" width="260" height="70" rx="12" fill="white" stroke="#C7D2FE" stroke-width="2"/>
  <text x="605" y="389" text-anchor="middle" class="node">BIOFORMATS2RAW converts</text>
  <text x="605" y="409" text-anchor="middle" class="node">source image to OME-Zarr</text>

  <rect x="475" y="460" width="260" height="70" rx="12" fill="white" stroke="#C7D2FE" stroke-width="2"/>
  <text x="605" y="489" text-anchor="middle" class="node">RAW2OMETIFF exports</text>
  <text x="605" y="509" text-anchor="middle" class="node">analysis-ready OME-TIFF</text>

  <path d="M605 430 L605 460" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- training -->
  <rect x="810" y="280" width="330" height="700" rx="18" fill="#FFF7ED" stroke="#FB923C" stroke-width="2"/>
  <text x="975" y="320" text-anchor="middle" class="track-title">training scaffold</text>

  <rect x="845" y="350" width="260" height="68" rx="12" fill="white" stroke="#FDBA74" stroke-width="2"/>
  <text x="975" y="379" text-anchor="middle" class="node">Stage 1: dataset staging and</text>
  <text x="975" y="399" text-anchor="middle" class="node">manifest contracts</text>

  <rect x="845" y="440" width="260" height="68" rx="12" fill="white" stroke="#FDBA74" stroke-width="2"/>
  <text x="975" y="469" text-anchor="middle" class="node">Stage 2: parent model staging</text>
  <text x="975" y="489" text-anchor="middle" class="node">(BioImage.io / local)</text>

  <rect x="845" y="530" width="260" height="68" rx="12" fill="white" stroke="#FDBA74" stroke-width="2"/>
  <text x="975" y="559" text-anchor="middle" class="node">Stage 3: training runner</text>
  <text x="975" y="579" text-anchor="middle" class="node">placeholder</text>

  <rect x="845" y="620" width="260" height="68" rx="12" fill="white" stroke="#FDBA74" stroke-width="2"/>
  <text x="975" y="649" text-anchor="middle" class="node">Stage 4: evaluation placeholder</text>
  <text x="975" y="669" text-anchor="middle" class="node">metrics and QA summaries</text>

  <rect x="845" y="710" width="260" height="68" rx="12" fill="white" stroke="#FDBA74" stroke-width="2"/>
  <text x="975" y="739" text-anchor="middle" class="node">Stage 5: publication scaffold</text>
  <text x="975" y="759" text-anchor="middle" class="node">for model package outputs</text>

  <rect x="845" y="800" width="260" height="68" rx="12" fill="white" stroke="#FDBA74" stroke-width="2"/>
  <text x="975" y="829" text-anchor="middle" class="node">Stage 6: RO-Crate packaging</text>
  <text x="975" y="849" text-anchor="middle" class="node">for FAIR provenance bundle</text>

  <path d="M975 418 L975 440" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M975 508 L975 530" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M975 598 L975 620" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M975 688 L975 710" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M975 778 L975 800" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- inference -->
  <rect x="1180" y="280" width="350" height="500" rx="18" fill="#F5F3FF" stroke="#A78BFA" stroke-width="2"/>
  <text x="1355" y="320" text-anchor="middle" class="track-title">inference scaffold</text>

  <rect x="1215" y="350" width="280" height="78" rx="12" fill="white" stroke="#C4B5FD" stroke-width="2"/>
  <text x="1355" y="382" text-anchor="middle" class="node">BIOFORMATS2RAW creates</text>
  <text x="1355" y="403" text-anchor="middle" class="node">sample OME-Zarr inputs</text>

  <rect x="1215" y="445" width="280" height="78" rx="12" fill="white" stroke="#C4B5FD" stroke-width="2"/>
  <text x="1355" y="477" text-anchor="middle" class="node">Inference runner scaffold</text>
  <text x="1355" y="498" text-anchor="middle" class="node">(current pass-through)</text>

  <rect x="1215" y="540" width="280" height="78" rx="12" fill="white" stroke="#C4B5FD" stroke-width="2"/>
  <text x="1355" y="572" text-anchor="middle" class="node">RAW2OMETIFF exports mask</text>
  <text x="1355" y="593" text-anchor="middle" class="node">and labelled OME-TIFF</text>

  <rect x="1215" y="635" width="280" height="78" rx="12" fill="white" stroke="#C4B5FD" stroke-width="2"/>
  <text x="1355" y="667" text-anchor="middle" class="node">Collect per-sample metadata</text>
  <text x="1355" y="688" text-anchor="middle" class="node">and software versions</text>

  <path d="M1355 428 L1355 445" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1355 523 L1355 540" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1355 618 L1355 635" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- selector connections -->
  <path d="M660 222 C600 250, 320 250, 235 280" stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M690 222 C670 250, 620 250, 605 280" stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M730 222 C840 250, 950 240, 975 280" stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M760 222 C940 260, 1280 240, 1355 280" stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- HITL loop -->
  <rect x="1160" y="840" width="390" height="70" rx="12" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2"/>
  <text x="1355" y="869" text-anchor="middle" class="node">Expert review and correction</text>
  <text x="1355" y="889" text-anchor="middle" class="node">in annotation tools</text>

  <rect x="1160" y="940" width="390" height="70" rx="12" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2"/>
  <text x="1355" y="969" text-anchor="middle" class="node">Curated labels and QC feedback</text>
  <text x="1355" y="989" text-anchor="middle" class="node">for retraining</text>

  <rect x="560" y="1030" width="520" height="90" rx="14" fill="#DCFCE7" stroke="#4ADE80" stroke-width="2"/>
  <text x="820" y="1065" text-anchor="middle" class="node">Versioned model and provenance artifact</text>
  <text x="820" y="1087" text-anchor="middle" class="node">for redeployment</text>

  <path d="M1355 713 L1355 840" stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1355 910 L1355 940" stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1160 975 C1080 975, 1040 950, 975 868" stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M975 868 L975 1030" stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1080 1075 C1250 1040, 1325 910, 1355 523" stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="1130" y="1030" class="small">feeds inference</text>
</svg>
