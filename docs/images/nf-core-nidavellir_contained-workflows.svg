<svg width="1700" height="1200" viewBox="0 0 1700 1200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">nf-core/nidavellir workflow metro map with workflow containers</title>
  <desc id="desc">Metro-style map where white station dots denote modules and large gray rounded rectangles denote workflows: inference, data storage, and training with HITL feedback.</desc>

  <defs>
    <style>
      .title { font: 700 34px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .workflow { font: 700 20px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .line-label { font: 700 16px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .station { font: 500 13px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .legend { font: 500 13px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #334155; }
    </style>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1700" height="1200" fill="#f3f4f6"/>

  <text x="90" y="72" class="title">nf-core/nidavellir • Workflow metro map</text>
  <text x="90" y="102" class="subtitle">White dots = modules • Gray containers = workflows</text>

  <!-- Workflow containers (large gray rectangles) -->
  <rect x="80" y="150" width="760" height="290" rx="34" fill="#d1d5db" opacity="0.65"/>
  <text x="110" y="188" class="workflow">Inference workflow</text>

  <rect x="900" y="150" width="720" height="290" rx="34" fill="#d1d5db" opacity="0.65"/>
  <text x="930" y="188" class="workflow">Data storage workflow (OMERO)</text>

  <rect x="250" y="620" width="1110" height="470" rx="38" fill="#d1d5db" opacity="0.65"/>
  <text x="290" y="662" class="workflow">Training workflow</text>

  <!-- External systems containers -->
  <rect x="560" y="470" width="260" height="120" rx="22" fill="#e5e7eb" stroke="#94a3b8" stroke-width="2"/>
  <text x="690" y="522" text-anchor="middle" class="workflow" style="font-size: 16px;">OMERO server</text>
  <text x="690" y="545" text-anchor="middle" class="station">images + labels + metadata</text>

  <rect x="940" y="470" width="300" height="120" rx="22" fill="#e5e7eb" stroke="#94a3b8" stroke-width="2"/>
  <text x="1090" y="522" text-anchor="middle" class="workflow" style="font-size: 16px;">BioImage Zoo / Hugging Face</text>
  <text x="1090" y="545" text-anchor="middle" class="station">parent model source</text>

  <!-- Main trunk -->
  <path d="M120 300 H260" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
  <circle cx="140" cy="300" r="12" fill="#ef4444" stroke="#111827" stroke-width="3"/>
  <text x="118" y="275" class="station">start</text>
  <circle cx="260" cy="300" r="12" fill="white" stroke="#64748b" stroke-width="6" filter="url(#softShadow)"/>
  <text x="285" y="305" class="station">workflow_track selector</text>

  <!-- Inference line -->
  <path d="M260 300 H760" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round"/>
  <text x="360" y="270" class="line-label">inference scaffold</text>
  <circle cx="380" cy="300" r="10" fill="white" stroke="#0ea5e9" stroke-width="6"/>
  <circle cx="500" cy="300" r="10" fill="white" stroke="#0ea5e9" stroke-width="6"/>
  <circle cx="640" cy="300" r="10" fill="white" stroke="#0ea5e9" stroke-width="6"/>
  <circle cx="760" cy="300" r="10" fill="white" stroke="#0ea5e9" stroke-width="6"/>
  <text x="360" y="330" class="station">BIOFORMATS2RAW</text>
  <text x="480" y="330" class="station">inference runner</text>
  <text x="620" y="330" class="station">RAW2OMETIFF</text>
  <text x="740" y="330" class="station">collect metadata</text>

  <!-- Human review node and transfer -->
  <path d="M760 300 H900" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round"/>
  <circle cx="900" cy="300" r="10" fill="white" stroke="#0ea5e9" stroke-width="6"/>
  <text x="920" y="305" class="station">expert review / correction</text>

  <!-- Data storage line -->
  <path d="M900 300 H1540" stroke="#14b8a6" stroke-width="12" stroke-linecap="round"/>
  <text x="1030" y="270" class="line-label">data_storage</text>
  <circle cx="1040" cy="300" r="10" fill="white" stroke="#14b8a6" stroke-width="6"/>
  <circle cx="1180" cy="300" r="10" fill="white" stroke="#14b8a6" stroke-width="6"/>
  <circle cx="1320" cy="300" r="10" fill="white" stroke="#14b8a6" stroke-width="6"/>
  <circle cx="1460" cy="300" r="10" fill="white" stroke="#14b8a6" stroke-width="6"/>
  <text x="1000" y="330" class="station">convert / stage labels</text>
  <text x="1145" y="330" class="station">upload OMERO image</text>
  <text x="1275" y="330" class="station">attach tags + ROIs</text>
  <text x="1435" y="330" class="station">persist IDs / annotations</text>

  <!-- generate_ometiff helper branch -->
  <path d="M1040 300 C1015 250, 980 230, 940 230" stroke="#6366f1" stroke-width="10" stroke-linecap="round"/>
  <circle cx="940" cy="230" r="10" fill="white" stroke="#6366f1" stroke-width="6"/>
  <text x="780" y="220" class="line-label">generate_ometiff</text>
  <text x="955" y="235" class="station">BIOFORMATS2RAW ↔ RAW2OMETIFF</text>

  <!-- Links to systems -->
  <path d="M1180 300 C1180 390, 1100 430, 1090 470" stroke="#64748b" stroke-width="3" fill="none" stroke-dasharray="8 8"/>
  <path d="M900 300 C860 390, 740 430, 690 470" stroke="#64748b" stroke-width="3" fill="none" stroke-dasharray="8 8"/>

  <!-- Training line inside training workflow -->
  <path d="M300 900 H1310" stroke="#f97316" stroke-width="14" stroke-linecap="round"/>
  <text x="360" y="870" class="line-label">training scaffold</text>

  <circle cx="380" cy="900" r="10" fill="white" stroke="#f97316" stroke-width="6"/>
  <circle cx="530" cy="900" r="10" fill="white" stroke="#f97316" stroke-width="6"/>
  <circle cx="680" cy="900" r="10" fill="white" stroke="#f97316" stroke-width="6"/>
  <circle cx="830" cy="900" r="10" fill="white" stroke="#f97316" stroke-width="6"/>
  <circle cx="980" cy="900" r="10" fill="white" stroke="#f97316" stroke-width="6"/>
  <circle cx="1130" cy="900" r="10" fill="white" stroke="#f97316" stroke-width="6"/>
  <circle cx="1310" cy="900" r="11" fill="#ef4444" stroke="#111827" stroke-width="3"/>

  <text x="350" y="930" class="station">Stage 1 dataset staging</text>
  <text x="492" y="930" class="station">Stage 2 parent model</text>
  <text x="646" y="930" class="station">Stage 3 training</text>
  <text x="804" y="930" class="station">Stage 4 evaluate</text>
  <text x="955" y="930" class="station">Stage 5 publish</text>
  <text x="1100" y="930" class="station">Stage 6 RO-Crate</text>
  <text x="1286" y="930" class="station">artifact out</text>

  <!-- Feedback / dependency lines -->
  <path d="M690 590 C690 720, 530 760, 530 900" stroke="#64748b" stroke-width="3" fill="none"/>
  <path d="M1090 590 C1090 710, 980 760, 980 900" stroke="#64748b" stroke-width="3" fill="none"/>
  <path d="M1460 300 C1560 340, 1590 760, 1130 900" stroke="#64748b" stroke-width="3" fill="none" stroke-dasharray="8 8"/>
  <path d="M1310 900 C1210 1040, 620 1040, 380 900" stroke="#0ea5e9" stroke-width="8" fill="none" stroke-linecap="round"/>
  <text x="760" y="1068" class="legend">HITL feedback loop returns curated labels/QC to retraining</text>

  <!-- Legend -->
  <rect x="90" y="1110" width="560" height="58" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="130" cy="1139" r="10" fill="white" stroke="#334155" stroke-width="5"/>
  <text x="155" y="1144" class="legend">White dots: modules</text>
  <rect x="340" y="1124" width="52" height="30" rx="8" fill="#d1d5db" opacity="0.75"/>
  <text x="405" y="1144" class="legend">Gray blocks: workflows</text>
</svg>
